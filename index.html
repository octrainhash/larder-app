<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Larder</title>
<meta name="description" content="Your groceries, at the store and at home.">
<meta name="theme-color" content="#f5eef1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f090d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Larder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">
  <header class="glass bar">
    <span class="brand">Larder</span>
    <button class="pill" id="savepill" aria-label="Open savings"></button>
    <button class="icon" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="glass tabs" id="nav" aria-label="Sections">
    <button data-t="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.1"/><circle cx="4.5" cy="12" r="1.1"/><circle cx="4.5" cy="18" r="1.1"/></svg><span>List</span></button>
    <button data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20.5V9l8-5.5L20 9v11.5z"/><path d="M9 20.5v-6h6v6"/></svg><span>At home</span></button>
    <button data-t="scan" class="scanbtn" aria-label="Scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M16.5 9v6"/></svg></button>
    <button data-t="recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"/><path d="M8 7.5c0-1.4 1-1.8 1-3.2M12 7.5c0-1.4 1-1.8 1-3.2M16 7.5c0-1.4 1-1.8 1-3.2"/></svg><span>Recipes</span></button>
    <button data-t="receipts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>Receipts</span></button>
  </nav>
</div>
<div class="sheet" id="sheet" hidden><div class="scrim" id="scrim"></div><div class="panel glass" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast glass" id="toast" hidden role="status"><span id="tmsg"></span><button id="tundo">Undo</button></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<input type="file" id="rfile" accept="image/*" hidden>
<script src="vendor/zxing.min.js" defer></script>
<script type="module" src="app.js"></script>
</body>
</html>
